<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in the Stratigraphy</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: var(--bg-grad);
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(5rem, 15vw, 10rem);
            color: var(--primary);
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
        }

        .error-msg {
            font-family: var(--font-tech);
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        .geology-joke {
            color: var(--text-sub);
            font-style: italic;
            margin-bottom: 3rem;
            max-width: 500px;
        }

        .error-code {
            animation: glitch 3s infinite;
            position: relative;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
                text-shadow: 2px 0 var(--secondary);
            }

            60% {
                transform: translate(2px, 2px);
                text-shadow: -2px 0 var(--primary);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }
    </style>
</head>

<body>
    <div class="noise-overlay"></div>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-msg">STRATUM NOT FOUND</div>
        <p class="geology-joke">
            "It seems you've wandered off the trail. This layer of the site has eroded away or hasn't been deposited
            yet."
        </p>
        <a href="https://krish686.github.io/prithvi-26/" class="btn-primary">
            <i class="fas fa-compass"></i> BACK TO BASECAMP
        </a>
    </div>

    <div id="geo-canvas" style="opacity: 0.5;"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
